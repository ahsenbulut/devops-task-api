# Continuous Integration: quality gates, tests and security scans.
# All jobs are independent and run in parallel; any failing job fails the workflow.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Deny everything by default; each job requests only what it needs.
permissions: {}

# One active run per PR: a new push to the PR cancels the outdated run.
# Pushes to main are never cancelled, so every commit on main gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  code-quality:
    name: Code quality (lint, format, typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (from .nvmrc) with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: dependency lifecycle scripts are not executed in CI.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  tests:
    name: Tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tasks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test -d tasks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: test
      PGPASSWORD: test
      PGDATABASE: tasks_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (from .nvmrc) with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Fails on any failing test or when coverage drops below the thresholds in vitest.config.ts.
      - name: Run unit and integration tests with coverage
        run: npm run test:coverage

      # Uploaded even when tests or thresholds fail, so the report can be inspected.
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  dependency-audit:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (from .nvmrc) with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Blocking policy:
      #   - runtime dependencies (shipped in the image): moderate or higher fails the build
      #   - all dependencies incl. dev tooling (runs in CI): high or critical fails the build
      - name: Audit runtime dependencies (moderate+)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies (high+)
        run: npm audit --audit-level=high

      # Verifies npm registry signatures and provenance attestations of installed packages.
      - name: Verify package signatures
        run: npm audit signatures

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz (matches the release's checksums.txt).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # Full history so secrets committed and later removed are still detected.
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The official CLI is used instead of gitleaks-action: pinned version, checksum
      # verified, no license key and no write permissions required.
      - name: Install Gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      # Exits non-zero on any finding; secret values are redacted in the log.
      - name: Scan git history for secrets
        run: |
          "${RUNNER_TEMP}/gitleaks" git --redact --verbose --exit-code 1 .

  sonarqube:
    name: SonarQube analysis and Quality Gate
    # Fork PRs get no secrets; the merged commit is analyzed on push to main before release.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tasks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test -d tasks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: test
      PGPASSWORD: test
      PGDATABASE: tasks_test
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js (from .nvmrc) with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Verify LCOV report
        run: |
          test -s coverage/lcov.info || { echo "::error::coverage/lcov.info is missing or empty"; exit 1; }
          files="$(grep -c '^SF:' coverage/lcov.info)"
          outside="$(grep '^SF:' coverage/lcov.info | grep -vc '^SF:src/' || true)"
          [[ "${files}" -gt 0 && "${outside}" == "0" ]] || { echo "::error::Unexpected LCOV content (files=${files}, outside src=${outside})"; exit 1; }
          echo "LCOV covers ${files} source files under src/"

      - name: SonarQube scan and Quality Gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
